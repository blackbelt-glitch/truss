<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amberMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="amberShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1C1000"/>
      <stop offset="60%" stop-color="#0E0900"/>
      <stop offset="100%" stop-color="#050400"/>
    </radialGradient>
    <!-- Very subtle glow — tight radius, low opacity -->
    <filter id="tightGlow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out" result="glowOnly"/>
      <feMerge>
        <feMergeNode in="glowOnly"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Subtle warm center bloom — very low opacity, not blurring the shapes -->
  <ellipse cx="512" cy="420" rx="280" ry="360" fill="#F59E0B" opacity="0.06"/>

  <!-- ═══ TOP BAR ═══ -->
  <rect x="96" y="128" width="832" height="130" rx="18" fill="url(#amberMain)"/>
  <!-- Specular shine on top bar -->
  <rect x="96" y="128" width="832" height="38" rx="18" fill="url(#amberShine)"/>
  <!-- Bottom edge darkening on top bar -->
  <rect x="96" y="242" width="832" height="16" rx="0" fill="black" opacity="0.18"/>

  <!-- ═══ LEFT STEM RAIL ═══ -->
  <rect x="426" y="258" width="62" height="604" fill="url(#amberMain)"/>

  <!-- ═══ RIGHT STEM RAIL ═══ -->
  <rect x="536" y="258" width="62" height="604" fill="url(#amberMain)"/>

  <!-- ═══ BOTTOM FOOT PLATE ═══ -->
  <rect x="396" y="840" width="232" height="56" rx="14" fill="url(#amberMain)"/>
  <!-- Shine on foot plate -->
  <rect x="396" y="840" width="232" height="18" rx="14" fill="url(#amberShine)"/>

  <!-- ═══ WARREN TRUSS DIAGONALS ═══ -->
  <!-- 5 panels, clean crisp lines — NO blur filter on these -->
  <g stroke="url(#amberMain)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Panel horizontals -->
    <line x1="426" y1="362" x2="598" y2="362" stroke-width="18"/>
    <line x1="426" y1="472" x2="598" y2="472" stroke-width="18"/>
    <line x1="426" y1="582" x2="598" y2="582" stroke-width="18"/>
    <line x1="426" y1="692" x2="598" y2="692" stroke-width="18"/>
    <!-- Warren diagonals -->
    <line x1="426" y1="258" x2="598" y2="362" stroke-width="16"/>
    <line x1="598" y1="362" x2="426" y2="472" stroke-width="16"/>
    <line x1="426" y1="472" x2="598" y2="582" stroke-width="16"/>
    <line x1="598" y1="582" x2="426" y2="692" stroke-width="16"/>
    <line x1="426" y1="692" x2="598" y2="840" stroke-width="16"/>
  </g>

  <!-- Clean mask to clip diagonals outside the stem -->
  <rect x="0"   y="258" width="426" height="604" fill="url(#bgGrad)"/>
  <rect x="598" y="258" width="426" height="604" fill="url(#bgGrad)"/>

  <!-- Joint dots at truss nodes — crisp circles -->
  <g fill="url(#amberMain)">
    <circle cx="426" cy="362" r="14"/>
    <circle cx="598" cy="362" r="14"/>
    <circle cx="426" cy="472" r="14"/>
    <circle cx="598" cy="472" r="14"/>
    <circle cx="426" cy="582" r="14"/>
    <circle cx="598" cy="582" r="14"/>
    <circle cx="426" cy="692" r="14"/>
    <circle cx="598" cy="692" r="14"/>
  </g>
</svg>
