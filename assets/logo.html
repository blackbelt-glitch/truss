<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Truss Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 48px; font-family: -apple-system, sans-serif; }
  
  .row { display: flex; gap: 40px; align-items: center; }
  
  .label { color: #666; font-size: 12px; text-align: center; margin-top: 8px; letter-spacing: 1px; text-transform: uppercase; }

  .icon-wrap { display: flex; flex-direction: column; align-items: center; }

  /* iOS rounded square mask */
  .ios { border-radius: 22.5%; overflow: hidden; }
  .ios-sm { border-radius: 20%; overflow: hidden; }
</style>
</head>
<body>

<div class="row">

  <!-- VERSION A: Warren Truss T -->
  <div class="icon-wrap">
    <div class="ios">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#0A0A0A"/>
      
      <!-- Top bar of T -->
      <rect x="24" y="30" width="152" height="26" rx="3" fill="#F59E0B"/>
      
      <!-- Left cap of top bar - structural end plate -->
      <rect x="24" y="30" width="8" height="26" fill="#D97706"/>
      <rect x="168" y="30" width="8" height="26" fill="#D97706"/>

      <!-- Vertical stem outer rails -->
      <rect x="86" y="56" width="11" height="114" fill="#F59E0B"/>
      <rect x="103" y="56" width="11" height="114" fill="#F59E0B"/>

      <!-- Bottom cap plate -->
      <rect x="80" y="158" width="40" height="12" rx="3" fill="#F59E0B"/>

      <!-- Warren truss diagonals inside stem -->
      <!-- Each triangle: alternating left-leaning and right-leaning -->
      <!-- Triangle 1: top-left to mid-right -->
      <polygon points="97,56 97,75 86,75" fill="#0A0A0A"/>
      
      <!-- Diagonal members as lines -->
      <line x1="97" y1="56" x2="86" y2="75" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="97" y1="75" x2="86" y2="56" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Full Warren truss pattern in the stem -->
      <!-- Using parallelogram diagonals -->
      <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round">
        <!-- Down-right diagonals -->
        <line x1="86" y1="56"  x2="114" y2="75"/>
        <line x1="86" y1="94"  x2="114" y2="113"/>
        <line x1="86" y1="132" x2="114" y2="151"/>
        <!-- Down-left diagonals -->
        <line x1="114" y1="75"  x2="86" y2="94"/>
        <line x1="114" y1="113" x2="86" y2="132"/>
        <line x1="114" y1="151" x2="86" y2="158"/>
        <!-- Horizontal cross members -->
        <line x1="86" y1="75"  x2="114" y2="75"/>
        <line x1="86" y1="94"  x2="114" y2="94"/>
        <line x1="86" y1="113" x2="114" y2="113"/>
        <line x1="86" y1="132" x2="114" y2="132"/>
        <line x1="86" y1="151" x2="114" y2="151"/>
      </g>

      <!-- Cover the diagonals that go outside the stem -->
      <rect x="0"   y="56" width="86"  height="114" fill="#0A0A0A"/>
      <rect x="114" y="56" width="86"  height="114" fill="#0A0A0A"/>
    </svg>
    </div>
    <div class="label">Warren Truss T</div>
  </div>

  <!-- VERSION B: Pratt Truss T — verticals + diagonals -->
  <div class="icon-wrap">
    <div class="ios">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#0A0A0A"/>
      
      <!-- Top bar -->
      <rect x="20" y="28" width="160" height="24" rx="4" fill="#F59E0B"/>
      
      <!-- Stem rails -->
      <rect x="84" y="52" width="12" height="120" fill="#F59E0B"/>
      <rect x="104" y="52" width="12" height="120" fill="#F59E0B"/>
      
      <!-- Bottom plate -->
      <rect x="78" y="160" width="44" height="12" rx="3" fill="#F59E0B"/>

      <!-- Pratt pattern: verticals + angled diagonals -->
      <g stroke="#F59E0B" stroke-width="3.2" stroke-linecap="round">
        <!-- Horizontal panels -->
        <line x1="84" y1="71"  x2="116" y2="71"/>
        <line x1="84" y1="95"  x2="116" y2="95"/>
        <line x1="84" y1="119" x2="116" y2="119"/>
        <line x1="84" y1="143" x2="116" y2="143"/>
        <!-- Diagonals toward center-bottom (Pratt: tension in diagonals) -->
        <line x1="84"  y1="52"  x2="116" y2="71"/>
        <line x1="116" y1="71"  x2="84"  y2="95"/>
        <line x1="84"  y1="95"  x2="116" y2="119"/>
        <line x1="116" y1="119" x2="84"  y2="143"/>
        <line x1="84"  y1="143" x2="116" y2="160"/>
      </g>

      <!-- Mask outside stem -->
      <rect x="0"   y="52" width="84"  height="120" fill="#0A0A0A"/>
      <rect x="116" y="52" width="84"  height="120" fill="#0A0A0A"/>
    </svg>
    </div>
    <div class="label">Pratt Truss T</div>
  </div>

  <!-- VERSION C: Clean geometric T with diamond truss nodes -->
  <div class="icon-wrap">
    <div class="ios">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#0A0A0A"/>
      
      <!-- Top bar — tapered ends for style -->
      <rect x="18" y="26" width="164" height="28" rx="5" fill="#F59E0B"/>
      
      <!-- Stem rails with slight taper feel -->
      <rect x="83" y="54" width="13" height="118" fill="#F59E0B"/>
      <rect x="104" y="54" width="13" height="118" fill="#F59E0B"/>
      
      <!-- Bottom foot plate -->
      <rect x="76" y="162" width="48" height="11" rx="3" fill="#F59E0B"/>

      <!-- Clean X-bracing inside stem — simple but effective -->
      <g stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round">
        <!-- Top X -->
        <line x1="83"  y1="54"  x2="117" y2="97"/>
        <line x1="117" y1="54"  x2="83"  y2="97"/>
        <!-- Mid horizontal -->
        <line x1="83"  y1="97"  x2="117" y2="97"/>
        <!-- Bottom X -->
        <line x1="83"  y1="97"  x2="117" y2="140"/>
        <line x1="117" y1="97"  x2="83"  y2="140"/>
        <!-- Bottom horizontal -->
        <line x1="83"  y1="140" x2="117" y2="140"/>
      </g>

      <!-- Diamond nodes at intersections -->
      <g fill="#F59E0B">
        <polygon points="100,91 106,97 100,103 94,97" />
        <polygon points="100,134 106,140 100,146 94,140"/>
      </g>

      <!-- Mask -->
      <rect x="0"   y="54" width="83"  height="118" fill="#0A0A0A"/>
      <rect x="117" y="54" width="83"  height="118" fill="#0A0A0A"/>
    </svg>
    </div>
    <div class="label">X-Brace with Nodes</div>
  </div>

</div>

<div class="row">

  <!-- VERSION D: Bold minimal — T with single triangle inside -->
  <div class="icon-wrap">
    <div class="ios">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#0A0A0A"/>
      
      <!-- Top bar -->
      <rect x="22" y="28" width="156" height="26" rx="4" fill="#F59E0B"/>
      
      <!-- Left stem rail -->
      <rect x="82" y="54" width="13" height="116" fill="#F59E0B"/>
      <!-- Right stem rail -->
      <rect x="105" y="54" width="13" height="116" fill="#F59E0B"/>
      
      <!-- Single large triangle inside stem = Howe truss feel -->
      <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <!-- Triangle pointing up -->
        <polyline points="82,170 100,54 118,170"/>
        <!-- Mid crossbar -->
        <line x1="82" y1="112" x2="118" y2="112"/>
        <!-- Lower sub-diagonals -->
        <line x1="91"  y1="170" x2="82"  y2="112"/>
        <line x1="109" y1="170" x2="118" y2="112"/>
      </g>

      <!-- Bottom plate -->
      <rect x="76" y="168" width="48" height="12" rx="3" fill="#F59E0B"/>

      <!-- Mask outside stem -->
      <rect x="0"   y="54" width="82"  height="126" fill="#0A0A0A"/>
      <rect x="118" y="54" width="82"  height="126" fill="#0A0A0A"/>
    </svg>
    </div>
    <div class="label">Triangle Inside T</div>
  </div>

  <!-- VERSION E: Wider T, denser Warren -->
  <div class="icon-wrap">
    <div class="ios">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <rect width="200" height="200" fill="#0A0A0A"/>
      
      <!-- Wider top bar with notched ends -->
      <path d="M16,26 L184,26 L184,52 L16,52 Z" fill="#F59E0B"/>
      <!-- Notch detail on ends -->
      <rect x="16" y="26" width="6" height="26" fill="#D97706" opacity="0.6"/>
      <rect x="178" y="26" width="6" height="26" fill="#D97706" opacity="0.6"/>
      
      <!-- Wider stem -->
      <rect x="78" y="52" width="15" height="118" fill="#F59E0B"/>
      <rect x="107" y="52" width="15" height="118" fill="#F59E0B"/>
      
      <!-- Bottom plate -->
      <rect x="72" y="160" width="56" height="12" rx="4" fill="#F59E0B"/>

      <!-- Dense Warren truss — 6 panels -->
      <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round">
        <line x1="78" y1="71"  x2="122" y2="71"/>
        <line x1="78" y1="90"  x2="122" y2="90"/>
        <line x1="78" y1="109" x2="122" y2="109"/>
        <line x1="78" y1="128" x2="122" y2="128"/>
        <line x1="78" y1="147" x2="122" y2="147"/>

        <line x1="78"  y1="52"  x2="122" y2="71"/>
        <line x1="122" y1="71"  x2="78"  y2="90"/>
        <line x1="78"  y1="90"  x2="122" y2="109"/>
        <line x1="122" y1="109" x2="78"  y2="128"/>
        <line x1="78"  y1="128" x2="122" y2="147"/>
        <line x1="122" y1="147" x2="78"  y2="160"/>
      </g>

      <!-- Mask -->
      <rect x="0"   y="52" width="78"  height="118" fill="#0A0A0A"/>
      <rect x="122" y="52" width="78"  height="118" fill="#0A0A0A"/>
    </svg>
    </div>
    <div class="label">Dense Warren</div>
  </div>

  <!-- VERSION F: Gradient + glow version of Warren -->
  <div class="icon-wrap">
    <div class="ios">
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#FBBF24"/>
          <stop offset="100%" style="stop-color:#D97706"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      
      <rect width="200" height="200" fill="#0A0A0A"/>
      <!-- Subtle vignette -->
      <radialGradient id="bg" cx="50%" cy="40%" r="60%">
        <stop offset="0%" style="stop-color:#1a1200"/>
        <stop offset="100%" style="stop-color:#0A0A0A"/>
      </radialGradient>
      <rect width="200" height="200" fill="url(#bg)"/>
      
      <!-- Top bar with gradient -->
      <rect x="20" y="27" width="160" height="26" rx="4" fill="url(#amberGrad)" filter="url(#glow)"/>
      
      <!-- Stem rails -->
      <rect x="84" y="53" width="12" height="116" fill="url(#amberGrad)"/>
      <rect x="104" y="53" width="12" height="116" fill="url(#amberGrad)"/>
      
      <!-- Bottom plate -->
      <rect x="78" y="160" width="44" height="12" rx="3" fill="url(#amberGrad)" filter="url(#glow)"/>

      <!-- Warren with glow -->
      <g stroke="url(#amberGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
        <line x1="84" y1="72"  x2="116" y2="72"/>
        <line x1="84" y1="95"  x2="116" y2="95"/>
        <line x1="84" y1="118" x2="116" y2="118"/>
        <line x1="84" y1="141" x2="116" y2="141"/>
        <line x1="84"  y1="53"  x2="116" y2="72"/>
        <line x1="116" y1="72"  x2="84"  y2="95"/>
        <line x1="84"  y1="95"  x2="116" y2="118"/>
        <line x1="116" y1="118" x2="84"  y2="141"/>
        <line x1="84"  y1="141" x2="116" y2="160"/>
      </g>

      <!-- Mask -->
      <rect x="0"   y="53" width="84"  height="119" fill="#0A0A0A"/>
      <rect x="116" y="53" width="84"  height="119" fill="#0A0A0A"/>
    </svg>
    </div>
    <div class="label">Gradient + Glow</div>
  </div>

</div>
