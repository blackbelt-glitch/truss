<svg width="1284" height="2778" viewBox="0 0 1284 2778" xmlns="http://www.w3.org/2000/svg">
  <rect width="1284" height="2778" fill="#0A0A0A"/>

  <!-- Subtle amber glow behind logo -->
  <ellipse cx="642" cy="1280" rx="300" ry="380" fill="#F59E0B" opacity="0.05"/>

  <!-- Logo: T-Truss centered, scaled up -->
  <g transform="translate(382, 1000)">
    <!-- Top bar -->
    <rect x="0" y="0" width="520" height="88" rx="12" fill="#F59E0B"/>
    <!-- Shine on top bar -->
    <rect x="0" y="0" width="520" height="22" rx="12" fill="white" opacity="0.15"/>

    <!-- Left rail -->
    <rect x="220" y="88" width="42" height="390" fill="#F59E0B"/>
    <!-- Right rail -->
    <rect x="258" y="88" width="42" height="390" fill="#F59E0B"/>

    <!-- Bottom plate -->
    <rect x="200" y="462" width="120" height="38" rx="10" fill="#F59E0B"/>

    <!-- Warren truss diagonals -->
    <g stroke="#F59E0B" stroke-width="12" stroke-linecap="round">
      <line x1="220" y1="88"  x2="300" y2="166"/>
      <line x1="300" y1="166" x2="220" y2="244"/>
      <line x1="220" y1="244" x2="300" y2="322"/>
      <line x1="300" y1="322" x2="220" y2="400"/>
      <line x1="220" y1="400" x2="300" y2="462"/>
      <line x1="220" y1="166" x2="300" y2="166"/>
      <line x1="220" y1="244" x2="300" y2="244"/>
      <line x1="220" y1="322" x2="300" y2="322"/>
      <line x1="220" y1="400" x2="300" y2="400"/>
    </g>

    <!-- Mask outside rails -->
    <rect x="0"   y="88" width="220" height="390" fill="#0A0A0A"/>
    <rect x="300" y="88" width="220" height="390" fill="#0A0A0A"/>
  </g>

  <!-- App name -->
  <text x="642" y="1610" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="96" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-3">Truss</text>

  <!-- Tagline -->
  <text x="642" y="1690" font-family="-apple-system, SF Pro Text, Helvetica Neue, sans-serif" font-size="38" font-weight="400" fill="#F59E0B" text-anchor="middle" letter-spacing="1">Speak your estimates.</text>
</svg>
